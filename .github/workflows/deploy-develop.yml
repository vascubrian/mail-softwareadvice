name: MAIL-SOFTWAREADVICE CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    # check alex dev branch
    - name: Building develop branch
      if: github.ref == 'refs/heads/develop'
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOSTNAME }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          set -e
          source /home/shuloizc/nodevenv/mail-softwareadvice/20/bin/activate && cd /home/shuloizc/mail-softwareadvice
          git remote set-url origin https://vascubrian:${{ secrets.GH_TOKEN }}@github.com/vascubrian/mail-softwareadvice.git
          git pull origin develop
          npm install --save
          npm run db:sync